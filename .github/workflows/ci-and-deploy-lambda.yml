name: CI and Deploy Lambda

on:
  push:
    branches: [ main ]       # run on every push to main
    paths:
      - 'app/**'
      - 'src/**'
      - 'infra/**'
      - 'models/best_model.pkl'
      - 'Dockerfile'
      - 'app_lambda.py'
      - 'predict_example.json'
      - 'tests/**'
  workflow_dispatch:          # allow manual runs from GitHub UI

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.deploy_decision.outputs.deploy_needed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide if deploy is needed
        id: deploy_decision
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-files)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          DEPLOY=false
          for path in $CHANGED_FILES; do
            case "$path" in
              app/*|src/*|infra/*|models/best_model.pkl|Dockerfile|app_lambda.py|predict_example.json)
                DEPLOY=true
                break
                ;;
            esac
          done

          echo "deploy_needed=$DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run core tests
        run: pytest tests/test_api.py tests/test_data_schema.py tests/test_model_artifact.py

      - name: Run predict_example.json smoke test
        run: pytest tests/test_predict_example_payload.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false -backend=false

      - name: Terraform fmt and validate
        working-directory: infra
        run: |
          terraform fmt -check
          terraform validate

      - name: Configure AWS credentials for terraform plan
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform plan (no apply)
        working-directory: infra
        run: terraform plan -input=false

  deploy:
    name: Build & push Lambda image, update function
    needs: ci
    if: needs.ci.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}     # e.g. donor-api
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}  # e.g. donor-api
      IMAGE_TAG: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Lambda function to use new image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Post-deploy Lambda /predict smoke test
        env:
          HTTP_API_INVOKE_URL: ${{ secrets.HTTP_API_INVOKE_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          URL="${HTTP_API_INVOKE_URL%/}/predict"
          BODY="$(cat predict_example.json)"
          HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
            -H "Content-Type: application/json" \
            -X POST "$URL" \
            -d "$BODY")

          echo "Status: $HTTP_CODE"
          cat response.json

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Expected HTTP 200 from Lambda, got $HTTP_CODE" >&2
            exit 1
          fi

          PROB=$(jq '.probability' response.json)
          PRED=$(jq '.prediction' response.json)

          awk "BEGIN {exit !($PROB >= 0 && $PROB <= 1)}" || {
            echo "probability out of [0,1] range: $PROB" >&2
            exit 1
          }

          if [ "$PRED" -ne 0 ] && [ "$PRED" -ne 1 ]; then
            echo "prediction must be 0 or 1, got $PRED" >&2
            exit 1
          fi
